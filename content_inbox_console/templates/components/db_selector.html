{% if databases %}
<form class="inline-flex items-center gap-sm" method="post" action="/environment/switch">
  <select name="database_path" class="db-select" onchange="this.form.submit()"
          style="max-width:200px; padding:0.2rem 0.4rem; font-size:0.75rem;">
    {% for db in databases %}
    <option value="{{ db.path }}" {% if db.is_current %}selected{% endif %}>
      {{ db.label }}{% if db.is_legacy %} (Legacy){% endif %}{% if not db.exists %} [缺失]{% endif %}
    </option>
    {% endfor %}
  </select>
</form>
{% endif %}
