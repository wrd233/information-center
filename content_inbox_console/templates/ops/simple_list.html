{% extends "base.html" %}
{% block content %}
<header class="page-header"><div><h1>{{ title }}</h1><p>Backed by the new content-inbox API and fresh DB.</p></div></header>
{% if items %}<div class="object-list">{% for item in items %}<article><pre>{{ item | tojson(indent=2) }}</pre></article>{% endfor %}</div>{% else %}<p class="empty-state">No {{ title | lower }} yet.</p>{% endif %}
{% endblock %}
