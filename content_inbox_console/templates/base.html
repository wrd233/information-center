<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}信息中心作战台{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/reset.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/layout.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/components.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/utilities.css') }}">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body class="app-shell">
  {% include "components/sidebar.html" %}
  {% include "components/topbar.html" %}
  <main class="app-main" id="main-content">
    {% if error or error_reason %}
    <div class="alert alert-error" role="alert">
      <strong>{{ error or error_reason }}</strong>
      <span class="alert-meta">Backend API: <code>{{ api_base }}</code></span>
    </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
