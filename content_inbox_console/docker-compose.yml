services:
  content-inbox-console:
    build: .
    container_name: content-inbox-console
    restart: unless-stopped
    environment:
      CONTENT_INBOX_CONSOLE_HOST: 0.0.0.0
      CONTENT_INBOX_CONSOLE_PORT: 8788
      CONTENT_INBOX_FRONTEND_API_BASE: http://host.docker.internal:8787
      CONTENT_INBOX_CONSOLE_PAGE_SIZE: 50
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8788:8788"
